<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>蜘蛛山之夜 - 试玩 Demo</title>
    <style>
      html, body { height: 100%; margin: 0; background: #071014; color: #eef1ed; }
      body { display: grid; place-items: center; font-family: "Microsoft YaHei", sans-serif; }
      main { text-align: center; }
      h1 { margin: 0 0 16px; font-size: 34px; font-weight: 500; letter-spacing: 0; }
      p { margin: 0; color: #a6b1ac; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <h1>蜘蛛山之夜</h1>
      <p id="status">正在载入试玩 Demo...</p>
    </main>
    <script>
      const status = document.getElementById('status');
      const launch = () => location.replace('./app/index.html?build=trial-demo-0.1.0');

      if (!('serviceWorker' in navigator)) {
        status.textContent = '当前浏览器不支持试玩版所需功能，请使用最新版 Chrome 或 Edge。';
      } else {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(() => navigator.serviceWorker.ready)
          .then(() => {
            if (navigator.serviceWorker.controller) {
              launch();
              return;
            }
            navigator.serviceWorker.addEventListener('controllerchange', launch, { once: true });
          })
          .catch((error) => {
            console.error(error);
            status.textContent = '试玩 Demo 载入失败，请刷新页面重试。';
          });
      }
    </script>
  </body>
</html>
